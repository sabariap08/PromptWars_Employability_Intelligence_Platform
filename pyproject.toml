[project]
name = "employability-intelligence-platform"
version = "1.0.0"
description = "Explainable employability intelligence for universities, employers and learners."
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RET", "RUF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
